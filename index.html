<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms 3D - Exploration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #888;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }
        #hud div {
            margin: 5px 0;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #666;
            font-family: 'Courier New', monospace;
            max-width: 300px;
        }
        #lockButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            font-size: 14px;
            background: rgba(100, 150, 200, 0.8);
            color: #fff;
            border: 2px solid #4a8fd8;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            z-index: 10;
            transition: all 0.3s ease;
        }
        #lockButton:hover {
            background: rgba(120, 170, 220, 0.9);
            border-color: #5aa8ff;
        }
        #lockButton:active {
            transform: scale(0.95);
        }
        .warning {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div><span class="warning">⚠ WARNING</span></div>
        <div>You are in the Backrooms</div>
        <div id="position">Position: (0, 0, 0)</div>
        <div id="fps">FPS: 60</div>
    </div>
    <div id="controls">
        <div><strong>CONTROLS:</strong></div>
        <div>W/A/S/D - Move</div>
        <div>MOUSE - Look around</div>
        <div>SPACE - Jump</div>
    </div>
    <button id="lockButton">🔓 Lock Mouse</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
// Scene Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffff99);
scene.fog = new THREE.Fog(0xffff99, 100, 200);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.7, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowShadowMap;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(50, 50, 50);
directionalLight.castShadow = true;
directionalLight.shadow.camera.left = -100;
directionalLight.shadow.camera.right = 100;
directionalLight.shadow.camera.top = 100;
directionalLight.shadow.camera.bottom = -100;
directionalLight.shadow.mapSize.width = 2048;
directionalLight.shadow.mapSize.height = 2048;
scene.add(directionalLight);

// Player Movement
const keys = {};
const player = {
    velocity: new THREE.Vector3(),
    speed: 0.15,
    jumpPower: 0.5,
    isGrounded: false,
    canJump: false
};

document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

// Mouse Look
let mouseX = 0, mouseY = 0;
let isLocked = false;

const lockButton = document.getElementById('lockButton');

// Toggle mouse lock with button
lockButton.addEventListener('click', () => {
    if (isLocked) {
        document.exitPointerLock = document.exitPointerLock || document.mozExitPointerLock;
        document.exitPointerLock();
    } else {
        renderer.domElement.requestPointerLock = renderer.domElement.requestPointerLock || renderer.domElement.mozRequestPointerLock;
        renderer.domElement.requestPointerLock();
    }
});

document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === renderer.domElement;
    lockButton.textContent = isLocked ? '🔒 Unlock Mouse' : '🔓 Lock Mouse';
});

document.addEventListener('mousemove', (e) => {
    if (isLocked) {
        mouseX += e.movementX * 0.003;
        mouseY += e.movementY * 0.003;
        mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
    }
});

// Create Backrooms Floor (Brown - #8B6F47)
function createFloor() {
    const floorMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x8B6F47,
        roughness: 0.8,
        metalness: 0.1
    });
    const floorGeometry = new THREE.PlaneGeometry(500, 500);
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
}

// Create Walls (Yellow - #FFFF00)
function createWalls() {
    const wallMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xFFFF00,
        roughness: 0.9,
        metalness: 0
    });
    
    const wallGeometry = new THREE.BoxGeometry(500, 200, 1);
    
    // Back Wall
    const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
    backWall.position.z = -250;
    backWall.position.y = 100;
    backWall.castShadow = true;
    backWall.receiveShadow = true;
    scene.add(backWall);
    
    // Front Wall
    const frontWall = new THREE.Mesh(wallGeometry, wallMaterial);
    frontWall.position.z = 250;
    frontWall.position.y = 100;
    frontWall.castShadow = true;
    frontWall.receiveShadow = true;
    scene.add(frontWall);
    
    // Left Wall
    const leftGeometry = new THREE.BoxGeometry(1, 200, 500);
    const leftWall = new THREE.Mesh(leftGeometry, wallMaterial);
    leftWall.position.x = -250;
    leftWall.position.y = 100;
    leftWall.castShadow = true;
    leftWall.receiveShadow = true;
    scene.add(leftWall);
    
    // Right Wall
    const rightWall = new THREE.Mesh(leftGeometry, wallMaterial);
    rightWall.position.x = 250;
    rightWall.position.y = 100;
    rightWall.castShadow = true;
    rightWall.receiveShadow = true;
    scene.add(rightWall);
}

// Create Ceiling (Darker Yellow - #CCCC00)
function createCeiling() {
    const ceilingMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xCCCC00,
        roughness: 0.95,
        metalness: 0
    });
    const ceilingGeometry = new THREE.PlaneGeometry(500, 500);
    const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 200;
    ceiling.receiveShadow = true;
    scene.add(ceiling);
}

// Create Fluorescent Lights
function createLights() {
    const lightGeometry = new THREE.PlaneGeometry(40, 80);
    const lightMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 1.2
    });
    
    for (let x = -200; x <= 200; x += 100) {
        for (let z = -200; z <= 200; z += 100) {
            const light = new THREE.Mesh(lightGeometry, lightMaterial);
            light.position.set(x, 195, z);
            light.rotation.x = -Math.PI / 2;
            scene.add(light);
        }
    }
}

// Create some random objects for atmosphere
function createAtmosphere() {
    const objects = [];
    
    for (let i = 0; i < 20; i++) {
        const boxGeometry = new THREE.BoxGeometry(
            Math.random() * 10 + 5,
            Math.random() * 15 + 10,
            Math.random() * 10 + 5
        );
        const boxMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xCCCCAA,
            roughness: 0.7
        });
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.position.set(
            Math.random() * 400 - 200,
            boxGeometry.parameters.height / 2,
            Math.random() * 400 - 200
        );
        box.castShadow = true;
        box.receiveShadow = true;
        scene.add(box);
        objects.push(box);
    }
    
    return objects;
}

// Initialize scene
createFloor();
createWalls();
createCeiling();
createLights();
createAtmosphere();

// Physics Raycast for ground detection
const raycaster = new THREE.Raycaster();
const downVector = new THREE.Vector3(0, -1, 0);

function checkGround() {
    const origin = camera.position.clone();
    raycaster.set(origin, downVector);
    
    const allObjects = scene.children.filter(obj => obj instanceof THREE.Mesh);
    const intersects = raycaster.intersectObjects(allObjects);
    
    if (intersects.length > 0 && intersects[0].distance < 1.7) {
        player.isGrounded = true;
        player.canJump = true;
    } else {
        player.isGrounded = false;
        if (camera.position.y < 0.1) {
            camera.position.y = 1.7;
            player.isGrounded = true;
            player.velocity.y = 0;
        }
    }
}

// Animation Loop
let frameCount = 0;
let lastTime = Date.now();

function animate() {
    requestAnimationFrame(animate);
    
    // FPS Counter
    frameCount++;
    const currentTime = Date.now();
    if (currentTime - lastTime >= 1000) {
        document.getElementById('fps').textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastTime = currentTime;
    }
    
    // Camera rotation
    camera.rotation.order = 'YXZ';
    camera.rotation.y = mouseX;
    camera.rotation.x = mouseY;
    
    // Player movement
    const moveDirection = new THREE.Vector3();
    if (keys['w']) moveDirection.z -= 1;
    if (keys['s']) moveDirection.z += 1;
    if (keys['a']) moveDirection.x -= 1;
    if (keys['d']) moveDirection.x += 1;
    
    if (moveDirection.length() > 0) {
        moveDirection.normalize();
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), mouseX);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), mouseX);
        
        const movement = forward.multiplyScalar(moveDirection.z).add(right.multiplyScalar(moveDirection.x));
        camera.position.add(movement.multiplyScalar(player.speed));
    }
    
    // Jumping
    if (keys[' '] && player.canJump) {
        player.velocity.y = player.jumpPower;
        player.canJump = false;
    }
    
    // Gravity
    player.velocity.y -= 0.02;
    camera.position.y += player.velocity.y;
    
    // Ground check
    checkGround();
    
    // Keep player in bounds
    if (camera.position.x < -240) camera.position.x = -240;
    if (camera.position.x > 240) camera.position.x = 240;
    if (camera.position.z < -240) camera.position.z = -240;
    if (camera.position.z > 240) camera.position.z = 240;
    
    // Update HUD
    document.getElementById('position').textContent = `Position: (${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)})`;
    
    renderer.render(scene, camera);
}

// Handle window resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
    </script>
</body>
</html>
